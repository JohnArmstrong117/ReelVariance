name: Deploy Reel Variance Prototype

on:
  push:
    branches: ["main"]
    paths:
      - "prototype/**"
      - ".github/workflows/publish-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out prototype files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            prototype

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload prototype website
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
